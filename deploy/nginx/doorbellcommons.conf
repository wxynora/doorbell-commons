server {
    server_name doorbellcommons.com;
    root /opt/doorbell-commons/apps/web/dist;
    index index.html;

    location = /farm {
        return 308 /farm/;
    }

    location = /farm/公共农场注册与存档迁入说明.md {
        alias /opt/aifarm/公共农场注册与存档迁入说明.md;
        default_type text/markdown;
        charset_types text/markdown;
        charset utf-8;
    }

    location /farm/ {
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8091/;
        proxy_redirect / /farm/;

        sub_filter_once off;
        sub_filter '="/ui/' '="/farm/ui/';
        sub_filter "='/ui/" "='/farm/ui/";
        sub_filter '="/agent/' '="/farm/agent/';
        sub_filter "='/agent/" "='/farm/agent/";
    }

    location = /farm-test {
        return 308 /farm-test/;
    }

    location /farm-test/ {
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:8092/;
        proxy_redirect / /farm-test/;

        sub_filter_once off;
        sub_filter '="/ui/' '="/farm-test/ui/';
        sub_filter "='/ui/" "='/farm-test/ui/";
        sub_filter '="/agent/' '="/farm-test/agent/';
        sub_filter "='/agent/" "='/farm-test/agent/";
    }

    location = /mcp {
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/doorbellcommons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doorbellcommons.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name doorbellcommons.com;
    return 301 https://$host$request_uri;
}
