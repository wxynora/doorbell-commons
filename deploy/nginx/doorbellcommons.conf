map $request_method $doorbell_auth_per_ip_key {
    default "";
    POST $binary_remote_addr;
}

map $request_method $doorbell_auth_global_key {
    default "";
    POST $server_name;
}

limit_req_zone $doorbell_auth_per_ip_key zone=doorbell_auth_per_ip:1m rate=10r/m;
limit_req_zone $doorbell_auth_global_key zone=doorbell_auth_global:1m rate=60r/m;

server {
    server_name doorbellcommons.com;
    root /opt/doorbell-commons/apps/web/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        types {
            text/css css;
            font/ttf ttf;
            font/woff2 woff2;
        }
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /farm {
        return 308 /farm/;
    }

    location = /farm/公共农场注册与存档迁入说明.md {
        alias /opt/aifarm/公共农场注册与存档迁入说明.md;
        default_type text/markdown;
        charset_types text/markdown;
        charset utf-8;
    }

    location /farm/ {
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_pass http://127.0.0.1:8091/;
        proxy_redirect / /farm/;

        sub_filter_once off;
        sub_filter '="/ui/' '="/farm/ui/';
        sub_filter "='/ui/" "='/farm/ui/";
        sub_filter '="/agent/' '="/farm/agent/';
        sub_filter "='/agent/" "='/farm/agent/";
    }

    location = /farm-test {
        return 308 /farm-test/;
    }

    location /farm-test/ {
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_pass http://127.0.0.1:8092/;
        proxy_redirect / /farm-test/;

        sub_filter_once off;
        sub_filter '="/ui/' '="/farm-test/ui/';
        sub_filter "='/ui/" "='/farm-test/ui/";
        sub_filter '="/agent/' '="/farm-test/agent/';
        sub_filter "='/agent/" "='/farm-test/agent/";
    }

    location = /mcp {
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/session {
        client_max_body_size 2m;
        limit_req zone=doorbell_auth_per_ip burst=5 nodelay;
        limit_req zone=doorbell_auth_global burst=20 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/doorbellcommons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doorbellcommons.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name doorbellcommons.com;
    return 301 https://$host$request_uri;
}
