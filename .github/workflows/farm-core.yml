name: Farm core

on:
  push:
    branches: [farm]
  pull_request:
    branches: [farm]

permissions:
  contents: read

jobs:
  lingye-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.16.0, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm run test:lingye-core
