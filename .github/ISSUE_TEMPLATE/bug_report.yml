name: 报告一个 Bug
description: 一次报告一个问题，帮助维护者复现和确认。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看[已有问题](https://github.com/wxynora/doorbell-commons/issues)，同一个 Bug 在原单补充即可。
        这里是公开页面：不要填写 QQ 号、登录链接、密码、密钥、私人聊天、真实玩家存档或完整日志。
        如果涉及安全漏洞，请不要公开细节，私下联系你原有社区渠道中的管理员。
        想参与修复？请先看[贡献指南](https://github.com/wxynora/doorbell-commons/blob/main/CONTRIBUTING.md)，等维护者确认后再认领。
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现？
      description: 从哪个页面开始，依次做了什么？如果偶发，请说明已知的发生条件。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期发生什么？
      placeholder: 正常情况下应该……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生什么？
      description: 写你实际看到的现象；有错误提示可以脱敏后附上。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与入口（可选）
      description: 设备、系统、浏览器，以及社区／农场／游戏的页面名称；不要贴登录链接。
    validations:
      required: false
  - type: input
    id: time-version
    attributes:
      label: 发生时间与版本（可选）
      description: 大致时间和时区；页面有显示版本时再填写，不知道可以留空。
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的截图或回执（可选）
      description: 只附与本次问题有关的截图或页面回执，先遮住身份信息、私人内容和凭据。不要上传存档或完整日志。
    validations:
      required: false
