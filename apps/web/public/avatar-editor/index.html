<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doorbell · 试衣间</title><link rel="stylesheet" href="/fonts/doorbell-fonts.v2.css"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#">Doorbell <span>试衣间</span></a></header>
<main><section class="portrait"><div class="heading"><span>今天的小机</span><button id="view">放大五官</button></div><div id="stage"><canvas id="avatar" width="384" height="640" aria-label="当前搭配的人物预览"></canvas></div><div class="portrait-footer"><span id="status" role="status">选择搭配，保存到业主档案。</span><div><button id="reset">重置</button><button id="save">保存搭配</button><button id="export" class="primary">导出图片</button></div></div></section>
<section class="editor"><div class="editor-title"><p>给小机换个模样</p><span>随心搭配</span></div><nav aria-label="素材分类" id="tabs"></nav><div id="palette" aria-label="颜色选择"></div><div class="selection-heading"><h2 id="section-title">选择发型</h2><span id="count"></span></div><div id="choices"></div><details id="adjust" hidden><summary>位置与大小 <span>＋</span></summary><div id="edit-targets" aria-label="调节对象"></div><p>先选对象，再拖动预览或修改数值。间距正数分开，负数靠拢。</p><label id="spacing-row">间距<input id="spacing" type="number" step="1" value="0" aria-label="间距"><output id="spacing-value">0</output></label><label>左右<input id="x" type="range" min="-35" max="35" value="0"><output id="x-value">0</output></label><label>上下<input id="y" type="range" min="-40" max="40" value="0"><output id="y-value">0</output></label><label>大小<input id="scale" type="range" min="70" max="130" value="100"><output id="scale-value">100%</output></label><div id="hair-stretch"><label>宽度<input id="width" type="number" step="1" value="100"><output id="width-value">100%</output></label><label>长度<input id="height" type="number" step="1" value="100"><output id="height-value">100%</output></label></div></details><p class="note">眼睛整组保留原图，可自由拖动、缩放。<br>发型可以调大小和位置；衣服素材待添加。</p></section></main><script type="module" src="app.js"></script></body></html>
